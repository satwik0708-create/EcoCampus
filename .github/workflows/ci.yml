name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration suite runs against a real PostgreSQL instance. The
    # behaviour it covers — transactional point awards, unique-constraint
    # idempotency, group-by aggregates — cannot be verified against a mock,
    # so CI provisions the same engine the application uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecocampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecocampus_test?schema=public
      # The schema declares a `directUrl` for migrations. The CI service
      # container is a direct connection with no pooler in front, so both
      # URLs are the same here — but the variable must be set, or the
      # Prisma CLI refuses to resolve the schema at all.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecocampus_test?schema=public
      CAMPUS_TIMEZONE: Asia/Kolkata
      SESSION_COOKIE_NAME: ecocampus_session
      SESSION_TTL_HOURS: "168"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
